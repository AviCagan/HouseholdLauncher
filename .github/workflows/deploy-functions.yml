name: Deploy Supabase functions

# Deploys the Edge Functions from CI, so none of this needs the Supabase CLI
# installed locally.
on:
  workflow_dispatch:
  push:
    branches: [claude/household-launcher-app-dc15ox, main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-functions.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets are lifted to job-level env because the `secrets` context is NOT
    # available in `if:` conditions — referencing it there makes the whole
    # workflow file invalid and nothing runs at all.
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      HOUSEHOLD_CODE_PEPPER: ${{ secrets.HOUSEHOLD_CODE_PEPPER }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The functions are Deno, so the app's tsc never sees them. Without this
      # a grammar error reaches the bundler mid-deploy and takes down whichever
      # functions were queued behind it.
      - run: npm ci
      - run: npx vitest run src/lib/functions-syntax.test.ts

      - name: Check credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets first."
            exit 1
          fi

      # Every one of these is fetched by something that cannot send an
      # Authorization header — Google Calendar polling the feed, Postgres
      # firing a webhook, the browser unfurling a link — so JWT verification
      # has to be off or the call is rejected before the code runs.
      - name: Deploy functions
        run: |
          supabase functions deploy calendar  --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy unfurl    --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy notify    --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy add       --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy recipe    --project-ref "$PROJECT_REF" --no-verify-jwt
          # `household` also runs without JWT verification, and has to: the
          # `redeem` action is called by someone with no session yet, which is
          # the entire point of it. Every other action authenticates the caller
          # itself — see the identify() function in its source.
          supabase functions deploy household --project-ref "$PROJECT_REF" --no-verify-jwt

      # Only the sender needs secrets, and only once they exist. Skipping this
      # leaves the other two functions perfectly usable.
      - name: Push notification secrets
        if: env.VAPID_PRIVATE_KEY != ''
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            VAPID_PUBLIC_KEY="$VAPID_PUBLIC_KEY" \
            VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" \
            VAPID_SUBJECT="${VAPID_SUBJECT:-mailto:things@example.com}"

      - name: Push Firebase service account
        if: env.FCM_SERVICE_ACCOUNT != ''
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            FCM_SERVICE_ACCOUNT="$FCM_SERVICE_ACCOUNT"

      # The pepper mixed into every household-code hash. Without it the
      # function falls back to a known constant, which still works but offers
      # no protection to a stolen credentials table — so this is a warning
      # rather than a silent skip.
      - name: Push household code pepper
        run: |
          if [ -z "$HOUSEHOLD_CODE_PEPPER" ]; then
            echo "::warning::HOUSEHOLD_CODE_PEPPER is not set — household codes are hashed with a public default. Set the repository secret."
          else
            supabase secrets set --project-ref "$PROJECT_REF" \
              HOUSEHOLD_CODE_PEPPER="$HOUSEHOLD_CODE_PEPPER"
          fi
