apply plugin: 'com.android.application'

/*
  versionCode used to be a hardcoded 1 on every single build. Android's
  installer uses that number — not the file's timestamp, not its hash — to
  decide whether an APK you tap is actually newer than what's already on the
  device. With every build reporting the same version, several install flows
  treat a fresh APK as "nothing to update" and silently leave the old app
  running: you tap install, nothing visibly happens, and you're still on
  yesterday's build with no error to explain why.

  GITHUB_RUN_NUMBER is exactly what this needs — set automatically by every
  Actions job and guaranteed to strictly increase, which versionCode requires.
  A local `./gradlew assembleDebug` with no CI env falls back to 1, which is
  fine: a real update always comes from CI from here on.
*/
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def buildSha = (System.getenv('GITHUB_SHA') ?: 'dev').take(7)

android {
    namespace = "com.avicagan.household"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.avicagan.household"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNumber
        versionName "1.0.${buildNumber}-${buildSha}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
      Release signing.

      Every build has to carry the SAME signature or Android refuses to install
      it over the previous one: you get "app not installed", and the only way
      through is to uninstall first, which wipes the sign-in and local settings.
      A debug build can never provide that — the debug keystore is regenerated
      on each CI runner, so consecutive builds are signed by different keys.

      The keystore itself is NOT in this repository. It is decoded from the
      ANDROID_KEYSTORE_B64 secret by the workflow, which writes it here as
      release.keystore. This repository is public, and a signing key in a public
      place would let anyone build an APK that Android accepts as a silent
      update to this one.

      The alias and passwords below are plain constants, and that is deliberate
      rather than an oversight: they protect nothing on their own. Without the
      key file they open nothing, and anyone holding the key file can read its
      alias straight out of it. Splitting them into four secrets would have
      meant four things to configure and four things to lose, for no additional
      protection.

      To rotate: make a new keystore, replace the secret, and expect one final
      uninstall on each phone — to Android a new key is a different app author.
    */
    signingConfigs {
        release {
            def keystoreFile = file('release.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                // Env vars win when supplied, so a keystore made some other way
                // still works without editing this file.
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'householdlauncher'
                keyAlias System.getenv('KEY_ALIAS') ?: 'household'
                keyPassword System.getenv('KEY_PASSWORD') ?: 'householdlauncher'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (file('release.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
